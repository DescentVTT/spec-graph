name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs the whole matrix again on the commit it
  # publishes: CI on main cancels a run when a newer push arrives, so a tagged
  # commit may never have finished one.
  workflow_call:

# A newer run of the same pull request or ref cancels the older one. Called by
# the release, `github.workflow` is the caller's name, Release, so its CI has a
# group of its own: a push to main cannot cancel a release rehearsal's CI
# halfway, and a rehearsal cannot cancel main's. A tag's release keys on the
# tag, which nothing else runs CI for.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository. Stated rather than inherited, because
# the default is whatever the repository setting happens to be.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']

    steps:
      # Pinned to a commit with the tag beside it, because a tag can be moved
      # and a commit cannot. A release is built by these actions (ADR-0021), so
      # a moved tag would be a way into the tarball.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Nothing here uses git again, and a token left in .git/config is one
          # a later step, or a dependency of one, could read.
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        id: build
        run: npm run build

      - name: Test
        run: npm test

      # spec-graph validates its own specification graph. If the design drifts
      # from the ADRs that describe it - a dangling citation, an obligation
      # delegated into an archived decision - this step fails with the line.
      - name: Check this repository's own specification graph
        run: npm run selfcheck

      # The same facts as a table on the job, which is the format's whole
      # argument: the step above fails with a line number for whoever is fixing
      # it, and says nothing to whoever is deciding whether to merge.
      #
      # Once, not six times, because the check runs on three platforms and two
      # Node versions and six identical tables are six times nothing. Even when
      # the check failed, because that is when somebody wants the table. Only
      # when the build succeeded, because there is no dist to run otherwise.
      # And never deciding the verdict - `check` already did that, and a second
      # red step for one finding is a second thing to read and dismiss.
      - name: Summarise it on the job
        if: always() && steps.build.outcome == 'success' && matrix.os == 'ubuntu-latest' && matrix.node == '22'
        continue-on-error: true
        run: node ./bin/spec-graph.js check --format markdown >> "$GITHUB_STEP_SUMMARY"

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Test with coverage
        run: npm run test:coverage

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
