name: Mutation

# Mutation testing runs on every push rather than on a schedule. A mutation
# score is only useful if it is current, and the whole point of measuring it
# here is that spec-graph is built out of heuristics: a vocabulary table or a
# boundary condition can be weakened by an ordinary-looking refactor without a
# single test going red.
#
# There is no paths filter. A dependency bump can move the score as easily as a
# source edit can, and filtering on src/** would miss it.
#
# That policy was unenforceable as written. A full run took 45 minutes on a
# hosted runner against the 45-minute cap, so it passed once and then never
# again as the corpus grew from 6,232 mutants to 7,720 - fourteen consecutive
# runs cancelled at the limit, each burning three quarters of an hour to report
# nothing. The score has not been checked in CI since v0.1.2.
#
# So: incremental on a push, which re-tests only what the change can have
# affected, and a full run where the number has to be trustworthy rather than
# fast - a tag, the weekly schedule, or a manual dispatch.
on:
  push:
  pull_request:
  schedule:
    # Monday, 03:00 UTC. Incremental reuse is an inference about which mutants a
    # change could reach; once a week the whole corpus is measured from scratch
    # so a wrong inference cannot accumulate unnoticed.
    - cron: '0 3 * * 1'
  workflow_dispatch:

# A push to a branch that also has an open pull request triggers both events.
# Keying on the PR number when there is one collapses those into a single run.
concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stryker:
    name: stryker
    runs-on: ubuntu-latest
    # Sized for the full run, not the incremental one. A cold cache, a
    # dependency bump or the weekly rebuild all take the long path, and a cap
    # that only fits the fast case is the cap that produced fourteen cancelled
    # runs.
    #
    # A ceiling costs nothing unless it is reached, and this one was nearly
    # reached. The full run measured 80 minutes at 0.3.0 and 103 at 0.4.0, on a
    # corpus that grew 6% - so what moved was the runner, not the work. The
    # incremental run on the same commit took 110, because a broad change leaves
    # it nothing to reuse. At 120 the margin was seventeen minutes, which is the
    # position that produced fourteen consecutive cancelled runs the last time,
    # and a cancelled run reports nothing after burning the full budget.
    timeout-minutes: 180

    # Decided once. Writing the condition twice and negating it by hand is how
    # the comment above came to promise a full run on manual dispatch while the
    # steps below gave an incremental one - a declaration that had drifted from
    # what runs, in the CI of the tool built to find those.
    env:
      FULL: >-
        ${{ github.event_name == 'schedule'
            || github.event_name == 'workflow_dispatch'
            || github.ref_type == 'tag' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Keyed on the run, not the commit, and restored from the most recent
      # entry by prefix. A miss is not a failure: it costs the full run, which
      # is what used to happen every time.
      #
      # The commit was the obvious key and it was wrong, because two runs share
      # one. At v0.4.0 the branch push and the tag were the same commit: the
      # push's incremental run saved `stryker-Linux-6f398ee` first, and the
      # tag's full run reported "Cache hit occurred on the primary key ..., not
      # saving cache" and threw its own report away. The next incremental then
      # restored the incremental lineage and reproduced its number to within one
      # mutant - 74.12 against 74.11 - while the rebuild that was supposed to
      # correct it had measured 75.40.
      #
      # So the one place a wrong inference was guaranteed to be caught could not
      # record having caught it. A run id is unique, so every run saves.
      #
      # What that does not do is carry a tag's rebuild into `main`. A run can
      # restore only caches from its own ref or the default branch, so the entry
      # a tag's full run saves lives under refs/tags/... where no later push can
      # read it - at 0.5.0 the next push restored the incremental lineage and read
      # 76.44 against the tag's 76.83. The prefix restore on `main` picks up the
      # last run that saved on `main`, so the only full runs that correct it are
      # the Monday schedule and a manual dispatch on `main`. See ADR-0007.
      - name: Restore the incremental report
        uses: actions/cache@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            stryker-${{ runner.os }}-

      # The config's concurrency of 8 is tuned for a developer machine. Hosted
      # runners have 4 vCPUs and each Stryker worker drives a vitest process of
      # its own, so oversubscribing here makes the run slower, not faster.
      - name: Mutation test (incremental)
        if: env.FULL != 'true'
        run: npx stryker run --concurrency 4 --incremental

      - name: Mutation test (full)
        if: env.FULL == 'true'
        run: npx stryker run --concurrency 4

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
