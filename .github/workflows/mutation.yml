name: Mutation

# Mutation testing runs on every push to `main` and every pull request rather
# than on a schedule. A mutation score is only useful if it is current, and the
# whole point of measuring it here is that spec-graph is built out of
# heuristics: a vocabulary table or a boundary condition can be weakened by an
# ordinary-looking refactor without a single test going red.
#
# There is no paths filter. A dependency bump can move the score as easily as a
# source edit can, and filtering on src/** would miss it.
#
# That policy was unenforceable as written. A full run took 45 minutes on a
# hosted runner against the 45-minute cap, so it passed once and then never
# again as the corpus grew from 6,232 mutants to 7,720 - fourteen consecutive
# runs cancelled at the limit, each burning three quarters of an hour to report
# nothing. The score has not been checked in CI since v0.1.2.
#
# So: incremental on a push, which re-tests only what the change can have
# affected, and a full run where the number has to be trustworthy rather than
# fast - a tag, the weekly schedule, or a manual dispatch.
on:
  # A push to a branch with an open pull request would otherwise run twice, once
  # per event. This comment used to say the concurrency key collapsed the two;
  # it could not, because a push event carries no pull request number. Filtering
  # the push the way ci.yml does is what actually leaves one run.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    # Monday, 03:00 UTC. Incremental reuse is an inference about which mutants a
    # change could reach; once a week the whole corpus is measured from scratch
    # so a wrong inference cannot accumulate unnoticed.
    - cron: '0 3 * * 1'
  workflow_dispatch:

# A newer push supersedes an older push's incremental run, so those cancel.
# Nothing a push does supersedes a full run, so the event is part of the key.
# Without it a scheduled run and a push to `main` shared one group, and GitHub
# cancels the older run in a group: a dispatch overtook a push run on 2026-09-07
# and the push run's annotation reads "Canceling since a higher priority waiting
# request for mutation-refs/heads/main exists". The weekly rebuild takes about
# three hours, and any push inside them would have ended it with nothing
# reported.
concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  stryker:
    name: stryker
    runs-on: ubuntu-latest
    # Sized for the full run, not the incremental one. A cold cache, a
    # dependency bump or the weekly rebuild all take the long path, and a cap
    # that only fits the fast case is the cap that produced fourteen cancelled
    # runs.
    #
    # A ceiling costs nothing unless it is reached, and this one keeps nearly
    # being reached. The full run measured 80 minutes at 0.3.0, 103 at 0.4.0 and
    # 168 at 0.5.0, the last against a cap of 180. The cause of that jump is not
    # attributed (ADR-0007), and raising the cap does not pretend to attribute
    # it: a slow run still reports its time, and a cancelled one is the only
    # outcome that leaves nothing to attribute. A hosted job may run for 360.
    timeout-minutes: 240

    # Decided once. Writing the condition twice and negating it by hand is how
    # the comment above came to promise a full run on manual dispatch while the
    # steps below gave an incremental one - a declaration that had drifted from
    # what runs, in the CI of the tool built to find those.
    env:
      FULL: >-
        ${{ github.event_name == 'schedule'
            || github.event_name == 'workflow_dispatch'
            || github.ref_type == 'tag' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Keyed on the run, not the commit, and restored from the most recent
      # entry by prefix. A miss is not a failure: it costs the full run, which
      # is what used to happen every time.
      #
      # The commit was the obvious key and it was wrong, because two runs share
      # one: at v0.4.0 the branch push and the tag were the same commit, and the
      # tag's run reported "Cache hit occurred on the primary key ..., not saving
      # cache". A run id is unique, so every run saves.
      #
      # A run can restore only caches from its own ref or the default branch, so
      # an entry a tag saves lives under refs/tags/... where no later push can
      # read it. The full runs that correct `main` are the Monday schedule and a
      # manual dispatch on `main` - and only since the full step below writes a
      # report at all. See ADR-0007.
      - name: Restore the incremental report
        uses: actions/cache@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            stryker-${{ runner.os }}-

      # The config's concurrency of 8 is tuned for a developer machine. Hosted
      # runners have 4 vCPUs and each Stryker worker drives a vitest process of
      # its own, so oversubscribing here makes the run slower, not faster.
      - name: Mutation test (incremental)
        if: env.FULL != 'true'
        run: npx stryker run --concurrency 4 --incremental

      # `--incremental --force`, not a bare run. Stryker writes the incremental
      # report only in incremental mode, so a bare full run left the file the
      # restore step had just put there untouched, and the cache saved that copy.
      # Every tag's rebuild did: 470,697 bytes restored and 470,702 saved at
      # 0.2.3, 472,222 and 472,228 at 0.3.0, 636,632 and 636,640 at 0.5.0.
      # `--force` retests every mutant and still writes what it measured.
      - name: Mutation test (full)
        if: env.FULL == 'true'
        run: npx stryker run --concurrency 4 --incremental --force

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
