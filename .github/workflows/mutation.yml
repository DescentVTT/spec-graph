name: Mutation

# Mutation testing runs on every push rather than on a schedule. A mutation
# score is only useful if it is current, and the whole point of measuring it
# here is that spec-graph is built out of heuristics: a vocabulary table or a
# boundary condition can be weakened by an ordinary-looking refactor without a
# single test going red.
#
# There is no paths filter. A dependency bump can move the score as easily as a
# source edit can, and filtering on src/** would miss it.
#
# That policy was unenforceable as written. A full run took 45 minutes on a
# hosted runner against the 45-minute cap, so it passed once and then never
# again as the corpus grew from 6,232 mutants to 7,720 - fourteen consecutive
# runs cancelled at the limit, each burning three quarters of an hour to report
# nothing. The score has not been checked in CI since v0.1.2.
#
# So: incremental on a push, which re-tests only what the change can have
# affected, and a full run where the number has to be trustworthy rather than
# fast - a tag, the weekly schedule, or a manual dispatch.
on:
  push:
  pull_request:
  schedule:
    # Monday, 03:00 UTC. Incremental reuse is an inference about which mutants a
    # change could reach; once a week the whole corpus is measured from scratch
    # so a wrong inference cannot accumulate unnoticed.
    - cron: '0 3 * * 1'
  workflow_dispatch:

# A push to a branch that also has an open pull request triggers both events.
# Keying on the PR number when there is one collapses those into a single run.
concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stryker:
    name: stryker
    runs-on: ubuntu-latest
    # Sized for the full run, not the incremental one. A cold cache, a
    # dependency bump or the weekly rebuild all take the long path, and a cap
    # that only fits the fast case is the cap that produced fourteen cancelled
    # runs.
    timeout-minutes: 90

    # Decided once. Writing the condition twice and negating it by hand is how
    # the comment above came to promise a full run on manual dispatch while the
    # steps below gave an incremental one - a declaration that had drifted from
    # what runs, in the CI of the tool built to find those.
    env:
      FULL: >-
        ${{ github.event_name == 'schedule'
            || github.event_name == 'workflow_dispatch'
            || github.ref_type == 'tag' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Keyed on the commit so every run leaves a fresh entry, and restored from
      # the most recent one by prefix. A miss is not a failure: it costs the
      # full run, which is what used to happen every time.
      - name: Restore the incremental report
        uses: actions/cache@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            stryker-${{ runner.os }}-

      # The config's concurrency of 8 is tuned for a developer machine. Hosted
      # runners have 4 vCPUs and each Stryker worker drives a vitest process of
      # its own, so oversubscribing here makes the run slower, not faster.
      - name: Mutation test (incremental)
        if: env.FULL != 'true'
        run: npx stryker run --concurrency 4 --incremental

      - name: Mutation test (full)
        if: env.FULL == 'true'
        run: npx stryker run --concurrency 4

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
