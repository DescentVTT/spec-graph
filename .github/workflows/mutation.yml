name: Mutation

# Mutation testing runs on every push to `main` and every pull request rather
# than on a schedule. A mutation score is only useful if it is current, and the
# whole point of measuring it here is that spec-graph is built out of
# heuristics: a vocabulary table or a boundary condition can be weakened by an
# ordinary-looking refactor without a single test going red.
#
# There is no paths filter. A dependency bump can move the score as easily as a
# source edit can, and filtering on src/** would miss it.
#
# Two tiers. A push to `main`, a tag, the weekly schedule and a manual dispatch
# run the full sweep, which re-derives every verdict from the code. A pull
# request runs incrementally, from the incremental file the last full sweep on
# `main` published, and only a full sweep publishes one: an incremental run's
# file is derived from a cache rather than from the code, and feeding it back is
# how ADR-0007 came to record an incremental lineage drifting from every rebuild
# for a week at a time.
#
# Both tiers run in shards. The sweep took 166 to 171 minutes on one runner, on
# identical source, three times. Each shard mutates its own files
# (scripts/mutation-shards.mjs) with every test, and a final job merges the
# reports, refuses anything that is not exactly one sweep, and applies the gate
# to the merged score. ADR-0019 has the measurements.
on:
  # A push to a branch with an open pull request would otherwise run twice, once
  # per event. Filtering the push the way ci.yml does leaves one run.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    # Monday, 03:00 UTC - nominally. GitHub created the 2026-09-14 run at 08:31.
    # A sweep that must be finished by a particular time needs a dispatch.
    - cron: '0 3 * * 1'
  workflow_dispatch:

# A newer push supersedes an older push's run, so those cancel. Nothing a push
# does supersedes a schedule or a dispatch, so the event is part of the key:
# without it a push to `main` cancelled a scheduled sweep on the same ref, and a
# run log from 2026-09-07 shows GitHub doing exactly that.
concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Decided once, for both jobs. Writing the condition twice and negating it by
# hand is how this file once promised a full run on manual dispatch while its
# steps gave an incremental one.
env:
  FULL: ${{ github.event_name != 'pull_request' }}

jobs:
  shard:
    name: stryker (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # Headroom for a bad runner, not a budget. The shards are balanced to about
    # 42 minutes each on the runner that took 166 for the whole sweep, and
    # runners have differed by more than a fifth on identical work. A shard that
    # keeps passing 55 means the table in scripts/mutation-shards.mjs needs
    # re-measuring, not this number raising.
    timeout-minutes: 75

    strategy:
      # One broken shard should not hide what the others found. The merge
      # refuses to score a sweep with a shard missing either way.
      fail-fast: false
      matrix:
        # One entry per shard in scripts/mutation-shards.mjs; a test checks.
        shard: [1, 2, 3, 4]

    env:
      MUTATION_SHARD: ${{ matrix.shard }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # A pull request starts from whatever `main` last published, by prefix. A
      # run can restore only caches from its own ref or the default branch, so a
      # file published anywhere but `main` would be one nothing could read. A
      # miss is not a failure: it costs the whole sweep, and the result is the
      # same. A full sweep restores nothing at all, so no verdict can be carried
      # into it.
      - name: Restore the incremental file
        if: env.FULL != 'true'
        uses: actions/cache/restore@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-sweep-${{ github.run_id }}
          restore-keys: |
            stryker-sweep-

      # The file holds the whole sweep, and Stryker reports the verdicts it holds
      # for files a run does not mutate as though the run had produced them. So
      # each shard keeps only its own files, and every test.
      - name: Keep this shard's part of the incremental file
        if: env.FULL != 'true'
        run: node scripts/mutation-shards.mjs cache "$MUTATION_SHARD"

      # The config's concurrency of 8 is tuned for a developer machine. Hosted
      # runners have 4 vCPUs and each Stryker worker drives a vitest process of
      # its own, so oversubscribing here makes the run slower, not faster.
      - name: Mutation test
        run: |
          started=$SECONDS
          if [ "$FULL" = "true" ]; then
            npx stryker run stryker.shard.config.mjs --concurrency 4
          else
            npx stryker run stryker.shard.config.mjs --concurrency 4 --incremental
          fi
          echo "{\"seconds\": $((SECONDS - started))}" > "reports/mutation/shard-$MUTATION_SHARD.timing.json"

      - uses: actions/upload-artifact@v7
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: reports/mutation/shard-${{ matrix.shard }}*.json
          if-no-files-found: error
          retention-days: 14

  score:
    name: mutation score
    needs: shard
    # Runs when a shard failed too, so the failure is reported as an incomplete
    # sweep rather than as a skipped check.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # The merge scores with Stryker's own metrics library.
      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          pattern: mutation-shard-*
          path: reports/shards

      - name: Merge the shards and apply the gate
        run: node scripts/mutation-shards.mjs merge reports/shards

      # Keyed on the run, not the commit: a tag and the push it came with share a
      # commit, and ADR-0007 records a cache keyed that way discarding the very
      # rebuild meant to correct it. Only `main` publishes, because a tag's or a
      # dispatch's entry on another ref is one no pull request can restore.
      - name: Publish the incremental file
        if: env.FULL == 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-sweep-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Say which tier ran
        if: always()
        run: |
          if [ "$FULL" = "true" ]; then
            echo "Full sweep: every mutant was tested from the code. This score governs." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Incremental: mutants whose source and covering tests were unchanged kept the last full sweep's verdict." >> "$GITHUB_STEP_SUMMARY"
            echo "It is a signal, not the figure. The full sweep on main is." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: |
            reports/mutation/index.html
            reports/mutation/mutation.json
          if-no-files-found: ignore
