name: Release

# Publishes to npm from a version tag, through npm's trusted publishing: the
# registry trusts this workflow by the OIDC identity GitHub issues the run, so
# there is no token to leak, and every version carries a provenance attestation
# naming the commit and the run that built it. The reasoning is in
# docs/adr/0021-releases-are-published-by-ci.md; what a maintainer does, and
# the one-time setup on npmjs.com, are in CONTRIBUTING.md.
#
# A tag stages the version rather than publishing it. `npm stage publish` puts
# it in a queue on npmjs.com, installable by nobody, and `npm stage approve`,
# which takes a person's second factor, releases it. A trusted publisher
# configured after 2026-09-03 permits staging by default and a direct publish
# only where the package opts in; 0.9.0 was refused at the upload for that
# reason, and staging keeps a person with 2FA as the last step, as spec-guard
# does.
on:
  push:
    tags: ['v*']
  # A rehearsal from main of the version package.json names: every job but the
  # GitHub release, with `npm stage publish --dry-run` in place of the upload.
  # npm asks npmjs.com for its token before `--dry-run` holds anything back,
  # so a rehearsal tries the exchange and its log says how that went. The
  # signing and the upload are what it cannot try.
  workflow_dispatch:
    inputs:
      # The npm a rehearsal installs, to try the one the pin might move to
      # without moving it. A tag has no inputs and stages with the pin.
      npm_version:
        description: 'A rehearsal only: one exact npm version to try, such as 12.2.0. A tag always uses the pin.'
        type: string
        default: '11.20.0'

# Never two releases at once, and never one cancelled halfway: a publish that
# stops after npm has the tarball is not a state anything can be rerun from.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The whole matrix, on the commit being published. CI on main cancels a run
  # when a newer push arrives, so a tagged commit may never have finished one.
  # The mutation sweep is not here: it runs on a `v*` tag of its own accord,
  # and a gate the release waits on would make every release wait for a number
  # that moves with the runner (ADR-0007, ADR-0021).
  ci:
    uses: ./.github/workflows/ci.yml

  pack:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist-tag: ${{ steps.release.outputs.dist-tag }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All of history, so the commit can be checked against main.
          fetch-depth: 0
          persist-credentials: false

      # No dependency cache: other runs write it, and the tarball this job
      # packs comes from the lockfile and the registry alone.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      # A tag can be pushed from anywhere, including a branch that was never
      # reviewed. Only what main has gets published.
      - name: Check the commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_SHA is not on main; release from a commit main has"
            exit 1
          }

      - name: Check the tag against the version and the changelog
        id: release
        run: |
          tag="$GITHUB_REF_NAME"
          # A rehearsal has no tag; it checks the one the version would have.
          if [ "$GITHUB_EVENT_NAME" != push ]; then tag="v$(node -p 'require("./package.json").version')"; fi
          node scripts/release.mjs "$tag" release-notes.md

      # No dependency's install script runs: the tree needs none, npm 12 runs
      # none unless package.json allows the package, and the flag has npm 10 and
      # 11 run none either (tests/npm.test.ts).
      - run: npm ci --ignore-scripts

      # The tarball's name is read off the directory npm packed into, as
      # spec-guard reads it, and not out of `npm pack --json`: npm 12 prints an
      # object keyed by the package's name where npm 11 and earlier print an
      # array, so a name taken from either shape is one the next npm takes
      # away. The directory is outside the checkout, where nothing of it can
      # be packed, and the tarball is moved to where the jobs below look.
      - name: Build and pack
        id: pack
        run: |
          npm run clean
          npm run build
          packed="$RUNNER_TEMP/packed"
          mkdir "$packed"
          npm pack --pack-destination "$packed"
          set -- "$packed"/*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::npm pack left something other than one tarball in $packed"
            exit 1
          fi
          mv "$1" .
          echo "tarball=${1##*/}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            ${{ steps.pack.outputs.tarball }}
            release-notes.md
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Named in the trusted publisher on npmjs.com. Protection rules - which refs
    # may deploy, and a required reviewer - go on this environment in the
    # repository's settings.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@descent-vtt/spec-graph/v/${{ needs.pack.outputs.version }}
    permissions:
      contents: read
      id-token: write # the OIDC token npmjs.com trades for the upload
    # Nothing is checked out, installed or built here. The one job that can
    # publish runs no code but npm's, and uploads the tarball the job above
    # built and CI tested, byte for byte. A compromised development dependency
    # runs in `pack`, where there is no token to take.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # The npm bundled with Node 24 is not reliably new enough to stage, and
      # when it is not the failure reads as an authentication error. Pinned to
      # the exact version every staged release so far has used: a range would
      # bring whatever npm published an hour ago into the one job that holds
      # the publish token, past the cooldown everything else waits out. Moving
      # it is an edit made on purpose, since Dependabot cannot see it here.
      #
      # A rehearsal may name another npm, and only a rehearsal: a tag installs
      # the pin whatever this step is handed. The name is text nobody vouched
      # for. It comes through the environment and is never written into the
      # script, and nothing is installed unless it is one exact version, so
      # no range, dist-tag, URL or path reaches npm for it to resolve.
      - name: An npm new enough to stage
        env:
          CANDIDATE: ${{ inputs.npm_version }}
        run: |
          pin=11.20.0
          required=11.15.0
          use="$pin"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # Each digit by name: a range is read by the runner's locale.
            part='(0|[123456789][0123456789]*)'
            exact="^$part\\.$part\\.$part\$"
            if ! [[ "$CANDIDATE" =~ $exact ]]; then
              echo "::error::npm_version must be one exact npm version, such as $pin; nothing was installed"
              exit 1
            fi
            use="$CANDIDATE"
          fi
          if [ "$(printf '%s\n%s\n' "$required" "$use" | sort -V | head -1)" != "$required" ]; then
            echo "::error::npm $use is older than $required, which npm stage publish needs; nothing was installed"
            exit 1
          fi
          npm install -g "npm@$use"
          installed="$(npm --version)"
          if [ "$installed" != "$use" ]; then
            echo "::error::npm $installed answers where npm $use was installed"
            exit 1
          fi
          if [ "$installed" = "$pin" ]; then
            used="npm $installed on node $(node --version), the pin"
          else
            used="npm $installed on node $(node --version), a candidate: a tag stages with the pin, $pin"
          fi
          echo "$used"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "Rehearsed with $used." >> "$GITHUB_STEP_SUMMARY"
          fi

      # A tag stages. A rehearsal hands npm the same tarball with `--dry-run`,
      # which signs and uploads nothing, and with `--loglevel verbose`, the
      # one level at which npm says how its exchange with npmjs.com went.
      # Main's version is on npm more often than not, and npm then stops at a
      # version check of its own, after it has read the tarball and tried the
      # exchange. That refusal is where such a rehearsal ends; any other
      # fails it.
      - name: Stage with provenance
        env:
          VERSION: ${{ needs.pack.outputs.version }}
          TARBALL: ${{ needs.pack.outputs.tarball }}
          DIST_TAG: ${{ needs.pack.outputs.dist-tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            npm stage publish "./$TARBALL" --tag "$DIST_TAG" --provenance --access public --ignore-scripts
            exit 0
          fi
          status=0
          out="$(npm stage publish "./$TARBALL" --tag "$DIST_TAG" --provenance=false --access public --ignore-scripts --dry-run --loglevel verbose 2>&1)" || status=$?
          printf '%s\n' "$out"
          if [ "$status" -ne 0 ]; then
            case "$out" in
              *"You cannot publish over the previously published versions: $VERSION."*)
                echo "::notice::$VERSION is on npm already, so npm stopped at its version check; the lines above that start 'npm verbose oidc' say how its token exchange went"
                ;;
              *) exit "$status" ;;
            esac
          fi

      - name: Say that it is staged, and how to release it
        if: github.event_name == 'push'
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          {
            echo '### Staged, not published'
            echo
            echo "@descent-vtt/spec-graph@$VERSION is queued on npmjs.com and installable by nobody."
            echo 'To release it, with 2FA:'
            echo
            echo '```'
            echo 'npm stage list @descent-vtt/spec-graph'
            echo 'npm stage view <stage-id>'
            echo 'npm stage approve <stage-id>'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: [pack, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release

      # The changelog section as the notes, and the tarball npm has as the
      # asset: one artifact, described once, in both places.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.pack.outputs.version }}
          DIST_TAG: ${{ needs.pack.outputs.dist-tag }}
          TARBALL: ${{ needs.pack.outputs.tarball }}
        run: |
          flags=()
          if [ "$DIST_TAG" = next ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$TARBALL" \
            --repo "$GITHUB_REPOSITORY" \
            --title "spec-graph $VERSION" \
            --notes-file release-notes.md \
            --verify-tag \
            "${flags[@]}"
